<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs - JobSharing</title>
<link href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700|Source+Sans+Pro:400,600,700&display=swap" rel="stylesheet">

<body>
<div id="site-header"></div>

<main class="container">
  <h1 class="page-title">Jobs</h1>

  <div class="search-box">
    <input type="text" id="kw" placeholder="Keywords">
    <input type="text" id="loc" placeholder="Location">
  </div>
  <div class="type-filters">
    <label><input type="checkbox" class="type-filter" value="Freelance" checked> Freelance</label>
    <label><input type="checkbox" class="type-filter" value="Full Time" checked> Full Time</label>
    <label><input type="checkbox" class="type-filter" value="Internship" checked> Internship</label>
    <label><input type="checkbox" class="type-filter" value="Part Time" checked> Part Time</label>
    <label><input type="checkbox" class="type-filter" value="Temporary" checked> Temporary</label>
  </div>
  <div class="results-bar"><span id="results-count">Loading&hellip;</span><span><a href="blog.html">Blog</a></span></div>

  <div id="job-list" class="job-list"></div>
  <button id="load-more" class="load-more" style="display:none">Load more listings</button>
  <p class="muted" style="font-size:13px;margin:20px 0 40px">Favourite jobs (&#9829;) are saved in this browser only.</p>
</main>

<div id="site-footer"></div>
